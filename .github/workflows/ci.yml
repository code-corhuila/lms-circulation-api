name: CI
on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Secrets: fail if a credential is committed, in this PR's code or anywhere in history.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Dependencies: fail on known vulnerabilities that are reachable from our code.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      # Authorization tests on their own, so a PR can never silently skip them.
      - name: authz tests
        run: go test ./internal/adapter/in/httpapi/middleware/... -run 'Auth|Authz|RequireCaller' -count=1

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      # README's own "go.sum is intentionally incomplete" note: this runner
      # has network access (my sandbox doesn't), so this actually resolves
      # the missing mongo-driver hashes for this job — it does not fix the
      # committed go.sum, that is still a separate, pre-existing follow-up.
      - name: go mod tidy
        run: go mod tidy
      - name: build
        run: go build -o bin/server ./cmd/api/...
      # M4 gap this closes: the service's own setup instructions are not just
      # written, they are executed here against a real MongoDB container on
      # every PR — /health/ready only needs the DB reachable, not migrations.
      - name: run and smoke-test
        env:
          PORT: "8080"
          DB_HOST: localhost
          DB_PORT: "27017"
          DB_USER: lms_user
          DB_PASSWORD: lms_password
          DB_NAME: loan_db
          INTERNAL_JWT_SECRET: ci-smoke-test-secret
          MEMBERSHIP_SERVICE_URL: http://localhost:18081
          CATALOG_SERVICE_URL: http://localhost:18082
          # Same dev-only throwaway RSA public key already committed in
          # .env.example (never the private key) — not a real secret.
          JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAmbNi1GoOVrL1Iq7e0vSH\nDVfxUnP3UB/ibjQXEv1xmhNCihKuZidRwam8xp1xVTzgh/J0lOajGPBUDsTMW2Ti\nGdmcCrbvAQ5YqTI2Dfxun02dKwIA/fHaLKzHdgCfddOasgkEFl1xj5xVMnYcUM7s\nFz/N7ENf2aR97FtrDZ1a3vDvy0G6l5qCIrWutnEJYvjQjSagWPXkXGawZpibLC/b\na6vesi3k5Nh3xdX7+ipoTIOGeyLbBSjMO/n3t1KVzP4oZgKWsZkIJVEny2PdODb7\nG192K1WwL7/WAt/Z2swWN12rGTRiDI86H90QWnK+iH/umvGuOna5nVSljzIlZYFP\nBwIDAQAB\n-----END PUBLIC KEY-----\n"
        run: |
          ./bin/server &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health/ready; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8080/health/ready
          kill $SERVER_PID
