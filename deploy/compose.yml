# Runs this service alone, against the env vars in ../.env — for local
# development against an already-running lms-circulation-db (its own
# docker-compose.yml). lms-infra composes every service together later
# (rules/2-anexos/G-infra.md); this file is not that composition.
services:
  circulation-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: circulation-api
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${PORT:-8080}:8080"
    networks:
      - lms-network

networks:
  lms-network:
    external: true
